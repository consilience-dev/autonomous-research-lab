<text x="629.0" y="304" fill="#a7bbd2" font-size="17" font-weight="400" text-anchor="middle">0.50</text>
<path d="M752.5 121L752.5 278" fill="none" stroke="#34506b" stroke-width="1.5"/>
<text x="752.5" y="304" fill="#a7bbd2" font-size="17" font-weight="400" text-anchor="middle">0.75</text>
<path d="M876.0 121L876.0 278" fill="none" stroke="#34506b" stroke-width="1.5"/>
<text x="876.0" y="304" fill="#a7bbd2" font-size="17" font-weight="400" text-anchor="middle">1.00</text>
<text x="44" y="164" fill="#f1f7ff" font-size="23" font-weight="700" text-anchor="start">Same wording</text>
<text x="44" y="189" fill="#a7bbd2" font-size="18" font-weight="400" text-anchor="start">Different topics</text>
<text x="337" y="169" fill="#6de9ce" font-size="30" font-weight="750" text-anchor="end">0.945</text>
