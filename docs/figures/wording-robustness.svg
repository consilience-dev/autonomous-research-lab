<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 369" width="960" height="369" role="img" aria-labelledby="title desc">
<title id="title">Layer-22 direction robustness</title>
<desc id="desc">Across topics at fixed wording the median cosine was .945, range .843 to .985. Across wordings at fixed topic the median was .211, range .003 to .470.</desc>
